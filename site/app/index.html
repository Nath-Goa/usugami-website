  <title>Usugami: free PDF tools in your browser</title>

  <script>
    // The address usugami.com reached over plain http (as GitHub's redirects can lead): the app
    // goes to https, where it can work offline, be installed and receive shared files.
    if (location.protocol === 'http:' && /^(www\.)?usugami\.com$/i.test(location.hostname)) location.replace('https://usugami.com' + location.pathname + location.search + location.hash);
    // The appearance and language saved in Settings, applied before the page is drawn so it
    // doesn't flash in the wrong theme.
    try {
      var saved = JSON.parse(localStorage.getItem('usugami.settings') || '{}') || {};
      if (saved.appearance === 'light' || saved.appearance === 'dark') document.documentElement.setAttribute('data-theme', saved.appearance);
      if (typeof saved.language === 'string' && /^[a-z]{2,3}$/.test(saved.language)) document.documentElement.lang = saved.language;
    } catch (e) {
      // No storage: the device's theme and the browser's language.
    }
  </script>
